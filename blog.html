<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog | Srija Mukhopadhyay</title>
  <link rel="icon" href="assets/favicon-blog.svg" type="image/svg+xml" />
  <script src="assets/theme.js"></script>
  <link rel="preload" href="https://cdn.jsdelivr.net/npm/gpt-tokenizer@3.4.0/dist/o200k_base.js" as="script" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet" />
  <style>
    :root {
      color-scheme: light;
      --bg: #fffdf8;
      --panel: #fbf8f1;
      --card: #ffffff;
      --ink: #25231f;
      --muted: #706b62;
      --soft: #a39a8c;
      --rule: #ebe5d8;
      --eol: #c4b8a5;
      --research: #0f9d8a;
      --reflection: #e0457b;
      --misc: #c27c05;
      --tok-ink: #25231f;
      --t0: #ffd6e0; --t1: #c9f2e3; --t2: #ffe6b3; --t3: #d9e4ff; --t4: #e8d9ff; --t5: #ffd9c2; --t6: #d6f5c9;
      --sans: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
      --serif: "Source Serif 4", Georgia, serif;
    }
    html[data-theme="dark"] {
      color-scheme: dark;
      --bg: #15140f;
      --panel: #1c1b16;
      --card: #24221c;
      --ink: #ece6dc;
      --muted: #aaa093;
      --soft: #7f776b;
      --rule: #2f2c25;
      --eol: #5e574c;
      --research: #2bb8a3;
      --reflection: #ec6a95;
      --misc: #e0a12e;
      --tok-ink: #f4efe6;
      --t0: #5c2f3d; --t1: #24493f; --t2: #5a4724; --t3: #2f3b5c; --t4: #43345e; --t5: #5c3d2b; --t6: #34502c;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      font-variant-ligatures: none;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    button { font-variant-ligatures: none; }

    .shell { width: min(1080px, calc(100% - 32px)); margin: 0 auto; padding: 18px 0 64px; }

    .topbar { display: flex; justify-content: space-between; align-items: center; gap: 16px; font-size: 13px; color: var(--muted); }
    .topbar a { border-bottom: 1px solid var(--rule); }
    .topbar a:hover { color: var(--ink); border-bottom-color: currentColor; }
    .theme-toggle {
      display: inline-flex; align-items: center; justify-content: center;
      width: 28px; height: 28px; border: 1px solid var(--rule); border-radius: 999px;
      background: transparent; color: var(--muted); cursor: pointer;
    }
    .theme-toggle:hover { color: var(--ink); }
    .theme-toggle .theme-icon { position: relative; display: block; width: 13px; height: 13px; border-radius: 50%; box-shadow: inset -4px -2px 0 currentColor; }
    .theme-toggle[data-theme-state="dark"] .theme-icon {
      width: 10px; height: 10px; background: currentColor;
      box-shadow: 0 -7px 0 -4px currentColor, 0 7px 0 -4px currentColor, 7px 0 0 -4px currentColor, -7px 0 0 -4px currentColor,
        5px 5px 0 -4px currentColor, -5px 5px 0 -4px currentColor, 5px -5px 0 -4px currentColor, -5px -5px 0 -4px currentColor;
    }

    h1 { font-family: var(--mono); font-weight: 500; font-size: 30px; margin: 28px 0 4px; letter-spacing: -0.01em; }
    h1 span { color: var(--soft); }
    .tagline { margin: 0 0 22px; font-family: var(--serif); font-style: italic; font-size: 18px; color: var(--muted); }


    .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
    .chip {
      font-family: var(--mono); font-size: 12.5px; padding: 4px 9px; border-radius: 5px; cursor: pointer;
      border: 1px solid var(--rule); background: var(--card); color: var(--ink);
    }
    .chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
    .chip .n { opacity: .55; margin-left: 4px; }
    .stats { font-family: var(--mono); font-size: 12px; color: var(--soft); margin: 4px 2px 10px; }

    .stream { border: 1px solid var(--rule); border-radius: 12px; background: var(--panel); overflow: hidden; }
    .row { display: block; padding: 11px 16px; border-top: 1px solid var(--rule); transition: background .15s; }
    .row:first-child { border-top: none; }
    .row:hover, .row:focus-visible { background: var(--card); outline: none; }
    .row[hidden] { display: none; }
    .line { display: flex; align-items: baseline; gap: 10px; }
    .toks { flex: 1; min-width: 0; font-family: var(--mono); font-size: 15px; line-height: 1.95; color: var(--tok-ink); }
    .special { font-family: var(--mono); font-weight: 700; color: #fff; padding: 2px 6px; border-radius: 4px; font-size: 12px; white-space: nowrap; background: var(--kind); }
    html[data-theme="dark"] .special { color: #15140f; }
    .date { font-family: var(--mono); font-size: 12px; color: var(--soft); white-space: nowrap; margin: 0 4px 0 6px; }
    .word { white-space: nowrap; }
    .tok { padding: 2px 0; border-radius: 3px; background-color: transparent; transition: background-color .35s ease; }
    .tok.on { background-color: var(--tc); }
    .eol { color: var(--eol); margin-left: 2px; }
    .meta { font-family: var(--mono); font-size: 11.5px; color: var(--soft); white-space: nowrap; }
    .read { font-size: 12.5px; font-weight: 600; white-space: nowrap; opacity: 0; transition: opacity .15s; }
    .row:hover .read, .row:focus-visible .read { opacity: 1; }
    .prev { font-size: 14px; color: var(--muted); line-height: 1.55; max-height: 0; overflow: hidden; transition: max-height .2s ease, margin .2s ease; }
    .row:hover .prev, .row:focus-visible .prev { max-height: 64px; margin-top: 4px; }
    .empty { padding: 18px 16px; color: var(--muted); font-size: 14px; }

    .layout { display: grid; grid-template-columns: minmax(0, 1fr) 250px; gap: 28px; align-items: start; }

    /* the next post, still being generated */
    .gen { padding: 12px 16px; border-top: 1px dashed var(--rule); font-family: var(--mono); font-size: 13px; color: var(--soft); }
    .gen .ghost { border: 1px dashed var(--eol); border-radius: 4px; padding: 1px 6px; margin-right: 8px; font-size: 12px; }
    .cursor { display: inline-block; width: .55em; height: 1.05em; margin-left: 3px; vertical-align: -2px; background: var(--soft); animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    /* side column */
    .card { border: 1px solid var(--rule); border-radius: 10px; background: var(--panel); padding: 12px 14px; margin-bottom: 12px; font-size: 13px; }
    .card .label { font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--soft); margin-bottom: 8px; }
    .card .label .emoji { letter-spacing: 0; margin-right: 6px; }
    .card .book { font-size: 13.5px; line-height: 1.45; color: var(--ink); }
    .card .book a { border-bottom: 1px solid var(--eol); }
    .card .book a:hover { border-bottom-color: currentColor; }
    .mix { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--rule); margin-bottom: 10px; }
    .mix span { height: 100%; }
    .mix-row { display: flex; justify-content: space-between; align-items: center; font-family: var(--mono); font-size: 12px; color: var(--muted); padding: 2px 0; }
    .mix-row .special { font-size: 11px; }

    @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
    @media (hover: none) { .prev { max-height: none; margin-top: 4px; } .read { opacity: 1; } }
    @media (max-width: 640px) { .line { flex-wrap: wrap; } .meta { display: none; } h1 { font-size: 24px; margin-top: 30px; } }
    @media (prefers-reduced-motion: reduce) { .tok, .prev { transition: none; } .cursor { animation: none; } }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <a href="index.html">&larr; back to notebook</a>
      <button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch to dark mode" title="Switch to dark mode">
        <span class="theme-icon" aria-hidden="true"></span>
      </button>
    </header>

    <h1>srija.blog<span>.tokenize()</span></h1>
    <p class="tagline">a gateway to my mind, and what I am thinking and doing.</p>

    <div class="layout">
      <section>
        <div class="bar" id="bar"></div>
        <div class="stats" id="stats"></div>
        <div class="stream" id="stream"><div class="empty">Loading posts&hellip;</div></div>
      </section>
      <aside id="aside"></aside>
    </div>
  </main>

  <script src="assets/blog-posts.js"></script>
  <script>
    function escapeHTML(text) {
      return String(text).replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[char]));
    }

    let posts = [];
    let filter = "all";
    let tokenCount = 0;

    function rowHTML(post, colorStart) {
      const title = window.tokenTitleSpan(post.title, colorStart);
      return `<a class="row" href="${window.blogPostHref(post)}" data-kind="${post.kind}" style="--kind: var(--${post.kind})">
        <div class="line">
          <div class="toks"><span class="special">&lt;|${post.kind}|&gt;</span><span class="date">${escapeHTML(post.when)}</span>${title.html}<span class="eol">&#8629;</span></div>
          <span class="meta"><span data-tok-slug="${post.slug}">${window.tokenLabel(window.postTokenCount(post))}</span> &middot; ${post.minutes} min read</span><span class="read">read &rarr;</span>
        </div>
        <div class="prev">${escapeHTML(post.summary)}</div>
      </a>`;
    }

    function renderStream() {
      let color = 0;
      tokenCount = 0;
      document.getElementById("stream").innerHTML = posts.length
        ? posts.map((post) => { const html = rowHTML(post, color); color += window.tokenizedTitleHTML(post.title).count; tokenCount += window.postTokenCount(post); return html; }).join("")
        : '<div class="empty">No posts yet.</div>';
      document.getElementById("stream").insertAdjacentHTML("beforeend",
        '<div class="gen"><span class="ghost">&lt;|...|&gt;</span>generating next post<span class="cursor"></span></div>');

      // Titles appear as plain text first, then turn into colored tokens one by one.
      const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
      document.querySelectorAll("#stream .tok").forEach((el, i) => setTimeout(() => el.classList.add("on"), reduce ? 0 : 450 + i * 18));
    }

    function renderBar() {
      const counts = { all: posts.length };
      posts.forEach((post) => { counts[post.kind] = (counts[post.kind] || 0) + 1; });
      const chips = [["all", "all posts"], ...Object.keys(window.BLOG_KINDS).map((kind) => [kind, `<|${kind}|>`])];
      document.getElementById("bar").innerHTML =
        chips.map(([kind, label]) => `<button type="button" class="chip ${kind === filter ? "on" : ""}" data-kind="${kind}">${escapeHTML(label)}<span class="n">${counts[kind] || 0}</span></button>`).join("");

      const shown = posts.filter((post) => filter === "all" || post.kind === filter).length;
      document.getElementById("stats").innerHTML = `${shown} post${shown === 1 ? "" : "s"} · <span data-tok-total>${window.tokenLabel(tokenCount)} written</span> · newest first` +
        (filter === "all" ? "" : ` · showing ${window.BLOG_KINDS[filter].plural}`);
    }

    function renderAside() {
      const kinds = Object.keys(window.BLOG_KINDS);
      const counts = {}; posts.forEach((post) => { counts[post.kind] = (counts[post.kind] || 0) + 1; });
      const total = posts.length || 1;
      const mix = `<div class="card"><div class="label">token mix</div>
        <div class="mix">${kinds.map((k) => `<span style="width:${(100 * (counts[k] || 0)) / total}%; background: var(--${k})"></span>`).join("")}</div>
        ${kinds.map((k) => `<div class="mix-row"><span class="special" style="--kind: var(--${k})">&lt;|${k}|&gt;</span><span>${counts[k] || 0}</span></div>`).join("")}
      </div>`;
      document.getElementById("aside").innerHTML = mix;
    }

    document.getElementById("bar").addEventListener("click", (event) => {
      const chip = event.target.closest("[data-kind]");
      if (chip) {
        filter = chip.dataset.kind;
        document.querySelectorAll("#stream .row").forEach((row) => { row.hidden = filter !== "all" && row.dataset.kind !== filter; });
      }
      renderBar();
    });

    window.getBlogPosts()
      .then((loaded) => { posts = loaded; renderStream(); renderBar(); renderAside(); })
      .catch(() => { document.getElementById("stream").innerHTML = '<div class="empty">Could not load posts.</div>'; });
  </script>
</body>
</html>
